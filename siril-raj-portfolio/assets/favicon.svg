<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0d1117" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6" />
  <text x="50" y="62" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">SR</text>
  <circle cx="78" cy="30" r="5" fill="#00f2fe" filter="url(#glow)" />
</svg>
